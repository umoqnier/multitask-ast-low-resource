[project]
name = "multitask-ast-low-resource"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diego Barriga", email = "dbarriga@ciencias.unam.mx" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "datasets>=4.6.1",
    "huggingface-hub>=0.26.0",
    "lhotse>=1.33.0",
    "lightning>=2.2.1",
    "nemo-toolkit[asr]==3.0.0",
    "numpy>=1.26",
    "omegaconf>=2.3.0",
    "rich>=13.9",
    # Default (no flag): torch comes from PyPI, which on Linux is the
    # CUDA (GPU-accelerated) build. Flags to override:
    #   uv sync --extra cu130  -> explicit +cu130 build (download.pytorch.org)
    #   uv sync --extra cpu    -> CPU-only build
    "torch>=2.10.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.10.0",
]
cu130 = [
    "torch>=2.10.0",
]

[project.scripts]
multitask-ast-low-resource = "multitask_ast_low_resource:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux'"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
